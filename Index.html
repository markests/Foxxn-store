<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOXXN STORE</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    overflow-x:hidden;
    background:#111;
}

/* =========================
   BACKGROUND VIDEO
========================= */

#bgVideo{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.48);
    backdrop-filter:blur(2px);
    -webkit-backdrop-filter:blur(2px);
    z-index:-2;
}

/* =========================
   TOMBOL MUSIK
========================= */

.music-button{
    position:fixed;
    top:18px;
    right:18px;

    width:48px;
    height:48px;

    border:none;
    border-radius:50%;

    background:rgba(0,0,0,.65);
    color:white;

    font-size:20px;

    cursor:pointer;

    z-index:20;

    border:1px solid rgba(255,255,255,.2);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);

    box-shadow:
        0 5px 20px rgba(0,0,0,.35);

    transition:.2s;
}

.music-button:hover{
    transform:scale(1.08);
}

.music-button:active{
    transform:scale(.9);
}

/* =========================
   CONTAINER
========================= */

.container{
    position:relative;
    width:100%;
    max-width:680px;
    min-height:100vh;
    margin:auto;
    padding:45px 18px 30px;

    display:flex;
    flex-direction:column;
    align-items:center;
}

/* =========================
   LOGO
========================= */

.logo{
    width:105px;
    height:105px;
    object-fit:cover;
    border-radius:50%;

    border:3px solid rgba(255,255,255,.9);

    box-shadow:
        0 5px 30px rgba(0,0,0,.6);

    margin-bottom:17px;
}

/* =========================
   NAME
========================= */

#name{
    font-size:30px;
    font-weight:700;
    text-align:center;

    text-shadow:
        0 3px 12px rgba(0,0,0,.8);

    margin-bottom:8px;
}

/* =========================
   DESCRIPTION
========================= */

#description{
    font-size:15px;
    text-align:center;
    opacity:.9;

    margin-bottom:28px;
}

/* =========================
   LINKS
========================= */

#links{
    width:100%;

    display:flex;
    flex-direction:column;
    gap:14px;
}

.link{
    width:100%;
    min-height:72px;

    display:flex;
    align-items:center;

    padding:9px 16px;

    color:white;
    text-decoration:none;

    background:rgba(10,25,40,.78);

    border:1px solid rgba(255,255,255,.14);

    border-radius:10px;

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    box-shadow:
        0 5px 20px rgba(0,0,0,.3);

    transition:
        transform .2s,
        background .2s;
}

.link:hover{
    transform:translateY(-3px);
    background:rgba(20,45,65,.9);
}

.link:active{
    transform:scale(.97);
}

/* FOTO */

.link-img{
    width:52px;
    height:52px;
    min-width:52px;

    object-fit:cover;
    border-radius:50%;

    margin-right:15px;

    background:rgba(255,255,255,.12);
}

/* TEKS */

.link-text{
    flex:1;
    min-width:0;
}

.link-title{
    font-size:16px;
    font-weight:bold;
    margin-bottom:5px;
}

.link-desc{
    font-size:13px;
    opacity:.7;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* PANAH */

.arrow{
    font-size:27px;
    opacity:.65;
    margin-left:10px;
}

/* =========================
   FOOTER
========================= */

.footer{
    margin-top:32px;
    font-size:12px;
    opacity:.55;
    text-align:center;
}

/* =========================
   HP
========================= */

@media(max-width:600px){

    .container{
        padding:35px 14px 25px;
    }

    .logo{
        width:95px;
        height:95px;
    }

    #name{
        font-size:27px;
    }

    #description{
        font-size:14px;
    }

    .link{
        min-height:68px;
        padding:8px 13px;
    }

    .link-img{
        width:48px;
        height:48px;
        min-width:48px;
        margin-right:13px;
    }

    .link-title{
        font-size:15px;
    }

    .link-desc{
        font-size:12px;
    }
}
</style>
</head>

<body>

<!-- =========================
     VIDEO BACKGROUND
========================= -->

<video
    id="bgVideo"
    autoplay
    loop
    playsinline
    preload="auto">
</video>

<div class="overlay"></div>


<!-- =========================
     TOMBOL MUSIK
========================= -->

<button
    id="musicButton"
    class="music-button"
    onclick="toggleMusic()">

    🔇

</button>

<audio id="music" loop></audio>


<!-- =========================
     WEBSITE
========================= -->

<main class="container">

    <img
        id="logo"
        class="logo"
        src=""
        alt="Logo"
    >

    <h1 id="name"></h1>

    <p id="description"></p>

    <div id="links"></div>

    <p class="footer">
        © 2026 YANN WEB DESIGN
    </p>

</main>


<script>

/* ==================================================
   ⚙️ PENGATURAN WEBSITE
   EDIT BAGIAN INI SAJA
================================================== */


/* 🎥 URL VIDEO BACKGROUND */

const VIDEO =
"https://files.catbox.moe/3432mf.mp4";


/* 🎵 URL MUSIK */

const MUSIC =
"https://files.catbox.moe/914jsm.mp3";


/* 🖼️ URL LOGO */

const LOGO =
"https://files.catbox.moe/b8x2c5.jpg";


/* 👤 NAMA */

const NAMA =
"FOXXN STORE";


/* 📝 DESKRIPSI */

const DESKRIPSI =
"J/B • STORE • TERPERCAYA & AMANAH";


/* ==================================================
   🔗 DAFTAR LINK
================================================== */

const DAFTAR_LINK = [

    {
        nama: "GROUP JB BLOODSTRIKE ",
        deskripsi: "Tempat jual beli akun BLOODSTRIKE",
        url: "https://chat.whatsapp.com/EUqnuImFwIM3PeSUYp8Dvf?mode=gi_t",
        gambar: "https://chat.whatsapp.com/EUqnuImFwIM3PeSUYp8Dvf?mode=gi_t"
    },

  {
        nama: "GROUP JB ALL GAME ",
        deskripsi: "Tempat jual beli akun ALLGAME",
        url: "https://chat.whatsapp.com/IrDoXApVYpHB1JzpVsMLIb?mode=gi_t",
        gambar: "https://chat.whatsapp.com/EUqnuImFwIM3PeSUYp8Dvf?mode=gi_t"
    },

    {
        nama: "STOCK & TESTI FOXXN STORE",
        deskripsi: "Lihat stock & testi terbaru",
        url: "https://whatsapp.com/channel/0029Vb1K1Nz3WHTdaHexMu1N",
        gambar: "https://example.com/stock.jpg"
    },

    {
        nama: "ADMIN UTAMA",
        deskripsi: "Hubungi admin",
        url: "https://wa.me/6285178436374",
        gambar: "https://example.com/admin.jpg"
    },

    {
        nama: "FACEBOOK RESMI",
        deskripsi: "Follow facebook kami",
        url: "https://www.facebook.com/share/197U2SExmW/",
        gambar: "https://example.com/instagram.jpg"
    }

];


/* ==================================================
   🚀 SISTEM WEBSITE
================================================== */

const video =
document.getElementById("bgVideo");

const logo =
document.getElementById("logo");

const name =
document.getElementById("name");

const description =
document.getElementById("description");

const links =
document.getElementById("links");

const music =
document.getElementById("music");

const musicButton =
document.getElementById("musicButton");


/* VIDEO */

video.src = VIDEO;

video.muted = false;
video.volume = 1;

video.play().catch(() => {

    video.muted = true;

    video.play().catch(() => {});

});


/* MUSIK */

music.src = MUSIC;

music.volume = 1;


/* STATUS MUSIK */

let musicOn = false;


/* ==================================================
   FUNCTION MUSIK
================================================== */

function toggleMusic(){

    if(musicOn === false){

        music.play()
        .then(() => {

            musicOn = true;

            musicButton.textContent = "🎵";

        })
        .catch(() => {

            musicOn = false;

            musicButton.textContent = "🔇";

        });

    }

    else{

        music.pause();

        musicOn = false;

        musicButton.textContent = "🔇";

    }

}


/* LOGO */

logo.src = LOGO;


/* NAMA */

name.textContent = NAMA;


/* DESKRIPSI */

description.textContent = DESKRIPSI;


/* ==================================================
   MEMBUAT SEMUA LINK
================================================== */

DAFTAR_LINK.forEach((item) => {

    const a =
    document.createElement("a");

    a.className = "link";

    a.href = item.url;

    a.target = "_blank";

    a.rel = "noopener noreferrer";


    /* FOTO */

    const img =
    document.createElement("img");

    img.className = "link-img";

    img.src = item.gambar;

    img.alt = "";

    img.onerror = function(){

        this.style.display = "none";

    };


    /* BAGIAN TEKS */

    const text =
    document.createElement("div");

    text.className = "link-text";


    const title =
    document.createElement("div");

    title.className = "link-title";

    title.textContent =
    item.nama;


    const desc =
    document.createElement("div");

    desc.className = "link-desc";

    desc.textContent =
    item.deskripsi;


    text.appendChild(title);

    text.appendChild(desc);


    /* PANAH */

    const arrow =
    document.createElement("div");

    arrow.className = "arrow";

    arrow.textContent = "›";


    /* GABUNGKAN */

    a.appendChild(img);

    a.appendChild(text);

    a.appendChild(arrow);

    links.appendChild(a);

});

</script>

</body>
  </html>
